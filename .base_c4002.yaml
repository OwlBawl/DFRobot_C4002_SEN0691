# DFRobot C4002 configuration base ESPhome

esphome:
  name: ${esp_name}
  friendly_name: ${esp_friendly}

logger:
  level: INFO
  baud_rate: 0 #Important. You can't use serial port
#  hardware_uart: UART0

debug:
  update_interval: 30s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 15dB
  reboot_timeout: 10min

  #important, otherwise the IP could change and then the entity is unavailable from home assistant.
#  manual_ip: #Change THIS
#    static_ip: ${ipstatic}
#    gateway: 10.10.20.1
#   subnet: 255.255.255.0

# Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${esp_friendly}
    password: !secret ap_wifi_pass
captive_portal:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key
    
ota:
  - platform: esphome

# Web config
#web_server:
#  include_internal: true
#  ota: false

#mqtt:
# DFRobot
#  broker: !secret ha_mqtt_ip
#  username: !secret ha_mqtt_user
#  password: !secret ha_mqtt_pass
#  discovery: false
#  client_id: ${dfrobot_id}
#  topic_prefix: null
#  id: ${dfrobot_id}_mqtt

# External components
external_components:
  - source:
      type: git
      url: https://github.com/OwlBawl/DFRobot_C4002_SEN0691.git
      ref: test
      path: .
    components:
      dfrobot_c4002
    refresh: 0s

# external_components:
#   - source:
#       type: local
#       path: custom_components

# C4002
dfrobot_c4002:
  id: ${dfrobot_id}
  uart_id: ${dfrobot_uart}

binary_sensor:
  # Common
  - platform: status
    name: ESP Online
    id: ha_connected
  # C4002 Out Pin (Hardware GPIO)
  - platform: gpio
    pin: GPIO33
    name: "Out Pin Presence"
    id: ${dfrobot_id}_out_presence
    device_class: presence
  # Native C4002 Event-Driven Motion & Presence (HomeKit-Compatible)
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    motion:
      name: "Motion"
      id: ${dfrobot_id}_motion
    presence:
      name: "Presence"
      id: ${dfrobot_id}_presence

# Sensor configuration
sensor:
  # Common
  - platform: wifi_signal
    name: "ESP WiFi RSSI"
    id: wifi_signal_rssi
    update_interval: 60s
    entity_category: "diagnostic" 
  - platform: internal_temperature
    name: "ESP Temperature"
    unit_of_measurement: °C
    device_class: TEMPERATURE
    update_interval: 30s
    entity_category: "diagnostic"
  - platform: uptime
    name: "ESP Uptime"
    id: sys_uptime
    update_interval: 60s
  - platform: debug
    free:
      id: esp_memory
      icon: mdi:memory
      name: ESP Free Memory
      filters:
        - lambda: return x / 1024;
      unit_of_measurement: 'kB'
      state_class: measurement
      entity_category: "diagnostic"
  # C4002
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    movement_distance:
      name: "Motion Distance"
      id: ${dfrobot_id}_movement_distance_sensor
    existing_distance:
      name: "Presence Distance"
      id: ${dfrobot_id}_existing_distance_sensor
    movement_speed:
      name: "Motion Speed"
      id: ${dfrobot_id}_movement_speed_sensor
    illuminance:
      name: "Illuminance"
      id: ${dfrobot_id}_illuminance
    movement_energy:
      name: "Motion Energy"
      id: ${dfrobot_id}_movement_energy
    existing_energy:
      name: "Presence Energy"
      id: ${dfrobot_id}_existing_energy
    presence_countdown:
      name: "Presence Countdown"
      id: ${dfrobot_id}_presence_countdown

text_sensor:
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    movement_direction:
      name: "Movement Direction"
      id: ${dfrobot_id}_movement_direction_text
      icon: "mdi:directions"
    active_gates_summary:
      name: "Active Gates Track"
      id: ${dfrobot_id}_active_gates_summary
      icon: "mdi:radar"

# Switch configuration
switch:
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    switch_out_led:
      name: "Out LED Switch"
      id: ${dfrobot_id}_out_led
    switch_run_led:
      name: "Run LED Switch"
      id: ${dfrobot_id}_run_led
    switch_environmental_calibration:
      name: "Sensor Calibration"
      id: ${dfrobot_id}_sensor_calibration
    switch_show_gates_energy:
      name: "Active Gates Tracking"
      id: ${dfrobot_id}_show_gates_energy

# Button configuration
button:
  # Common
  - platform: restart
    name: "ESP Restart"
  - platform: safe_mode
    name: "ESP Restart (Safe Mode)"
  # C4002
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    refresh_parameters:
      name: "Refresh Parameters"
      id: ${dfrobot_id}_refresh_parameters
    factory_reset:
      name: "Factory Reset"
      id: ${dfrobot_id}_factory_reset

# Select configuration
select:
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    operating_mode:
      name: "OUT Mode"
      id: ${dfrobot_id}_out_mode_select
    motion_sensitivity:
      name: "Motion Sensitivity"
      id: ${dfrobot_id}_motion_sensitivity
    presence_sensitivity:
      name: "Presence Sensitivity"
      id: ${dfrobot_id}_presence_sensitivity
    resolution_mode:
      name: "Resolution Mode"
      id: ${dfrobot_id}_resolution_mode

# Min and max detection range configuration
number:
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    max_range:
      name: "Max Detection Distance"
      id: ${dfrobot_id}_max_range
    min_range:
      name: "Min Detection Distance"
      id: ${dfrobot_id}_min_range
    light_threshold:
      name: "Light Threshold"
      id: ${dfrobot_id}_light_threshold
    lock_time:
      name: "Lock Time"
      id: ${dfrobot_id}_lock_time
    report_period:
