# DFRobot C4002 configuration base ESPhome

esphome:
  name: ${esp_name}
  friendly_name: ${esp_friendly}

logger:
  level: INFO
  baud_rate: 0 #Important. You can't use serial port
#  hardware_uart: UART0

debug:
  update_interval: 30s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 15dB
  reboot_timeout: 10min

  #important, otherwise the IP could change and then the entity is unavailable from home assistant.
#  manual_ip: #Change THIS
#    static_ip: ${ipstatic}
#    gateway: 10.10.20.1
#   subnet: 255.255.255.0

# Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${esp_friendly}
    password: !secret ap_wifi_pass
captive_portal:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key
    
ota:
  - platform: esphome

# Web config
#web_server:
#  include_internal: true
#  ota: false

#mqtt:
# DFRobot
#  broker: !secret ha_mqtt_ip
#  username: !secret ha_mqtt_user
#  password: !secret ha_mqtt_pass
#  discovery: false
#  client_id: ${dfrobot_id}
#  topic_prefix: null
#  id: ${dfrobot_id}_mqtt

# External components
external_components:
  - source:
      type: git
      url: https://github.com/OwlBawl/DFRobot_C4002_SEN0691.git
      ref: test
      path: .
    components:
      dfrobot_c4002
    refresh: 0s

# external_components:
#   - source:
#       type: local
#       path: custom_components

# C4002
dfrobot_c4002:
  id: ${dfrobot_id}
  uart_id: ${dfrobot_uart}

binary_sensor:
  # Common
  - platform: status
    name: ESP Online
    id: ha_connected
  # C4002 Out Pin
  - platform: gpio
    pin: GPIO33
    name: "Out Pin Presence"
    id: ${dfrobot_id}_out_presence
    device_class: presence
  # C4002 Distance Gates
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    gate_0:
      name: "Gate 0 (0.2m)"
      id: ${dfrobot_id}_gate_0
    gate_1:
      name: "Gate 1 (0.8m)"
      id: ${dfrobot_id}_gate_1
    gate_2:
      name: "Gate 2 (1.6m)"
      id: ${dfrobot_id}_gate_2
    gate_3:
      name: "Gate 3 (2.4m)"
      id: ${dfrobot_id}_gate_3
    gate_4:
      name: "Gate 4 (3.2m)"
      id: ${dfrobot_id}_gate_4
    gate_5:
      name: "Gate 5 (4.0m)"
      id: ${dfrobot_id}_gate_5
    gate_6:
      name: "Gate 6 (4.8m)"
      id: ${dfrobot_id}_gate_6
    gate_7:
      name: "Gate 7 (5.6m)"
      id: ${dfrobot_id}_gate_7
    gate_8:
      name: "Gate 8 (6.4m)"
      id: ${dfrobot_id}_gate_8
    gate_9:
      name: "Gate 9 (7.2m)"
      id: ${dfrobot_id}_gate_9
    gate_10:
      name: "Gate 10 (8.0m)"
      id: ${dfrobot_id}_gate_10
    gate_11:
      name: "Gate 11 (8.8m)"
      id: ${dfrobot_id}_gate_11
    gate_12:
      name: "Gate 12 (9.6m)"
      id: ${dfrobot_id}_gate_12
    gate_13:
      name: "Gate 13 (10.4m)"
      id: ${dfrobot_id}_gate_13
    gate_14:
      name: "Gate 14 (11.2m)"
      id: ${dfrobot_id}_gate_14

# Sensor configuration
sensor:
  # Common
  - platform: wifi_signal
    name: "ESP WiFi RSSI"
    id: wifi_signal_rssi
    update_interval: 60s
    entity_category: "diagnostic" 
  - platform: internal_temperature
    name: "ESP Temperature"
    unit_of_measurement: °C
    device_class: TEMPERATURE
    update_interval: 30s
    entity_category: "diagnostic"
  - platform: uptime
    name: "ESP Uptime"
    id: sys_uptime
    update_interval: 60s
  - platform: debug
    free:
      id: esp_memory
      icon: mdi:memory
      name: ESP Free Memory
      filters:
        - lambda: return x / 1024;
      unit_of_measurement: 'kB'
      state_class: measurement
      entity_category: "diagnostic"
  # C4002
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    movement_distance:
      name: "Motion Distance"
      id: ${dfrobot_id}_movement_distance_sensor
    existing_distance:
      name: "Presence Distance"
      id: ${dfrobot_id}_existing_distance_sensor
    movement_speed:
      name: "Motion Speed"
      id: ${dfrobot_id}_movement_speed_sensor
    movement_direction:
      name: "Motion Direction"
      id: ${dfrobot_id}_movement_direction_sensor
      internal: true
    target_status:
      name: "Target Status"
      id: ${dfrobot_id}_target_status_sensor
      internal: true
    illuminance:
      name: "Illuminance"
      id: ${dfrobot_id}_illuminance
    movement_energy:
      name: "Motion Energy"
      id: ${dfrobot_id}_movement_energy
    existing_energy:
      name: "Presence Energy"
      id: ${dfrobot_id}_existing_energy
    presence_countdown:
      name: "Presence Countdown"
      id: ${dfrobot_id}_presence_countdown
    active_gates:
      name: "Active Gates Bitmask"
      id: ${dfrobot_id}_active_gates

text_sensor:
  - platform: template
    name: "Movement Direction"
    id: ${dfrobot_id}_movement_direction_text
    icon: "mdi:directions"
    lambda: |-
      int d = id(${dfrobot_id}_movement_direction_sensor).state;
      if (d == 0) return {"Away"};
      else if (d == 1) return {"No Direction"};
      else if (d == 2) return {"Approaching"};
      else return {"Unknown"};
    update_interval: 1s

  - platform: template
    name: "Target Status"
    id: ${dfrobot_id}_target_status_text
    icon: "mdi:human-greeting"
    lambda: |-
      int d = id(${dfrobot_id}_target_status_sensor).state;
      if (d == 0) return {"No Target"};
      else if (d == 1) return {"Static Presence"};
      else if (d == 2) return {"Motion"};
      else return {"Unknown"};
    update_interval: 0.5s

  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    c4002_text_sensor:
      name: "Log"
      id: ${dfrobot_id}_log
      icon: "mdi:message-text-outline"
    active_gates_summary:
      name: "Active Gates Track"
      id: ${dfrobot_id}_active_gates_summary
      icon: "mdi:radar"

# Switch configuration
switch:
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    switch_out_led:
      name: "Out LED Switch"
      id: ${dfrobot_id}_out_led
    switch_run_led:
      name: "Run LED Switch"
      id: ${dfrobot_id}_run_led
    switch_environmental_calibration:
      name: "Sensor Calibration"
      id: ${dfrobot_id}_sensor_calibration
    switch_show_gates_energy:
      name: "Show Gates Energy"
      id: ${dfrobot_id}_show_gates_energy

# Button configuration
button:
  # Common
  - platform: restart
    name: "ESP Restart"
  - platform: safe_mode
    name: "ESP Restart (Safe Mode)"
  # C4002
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    refresh_parameters:
      name: "Refresh Parameters"
      id: ${dfrobot_id}_refresh_parameters
    factory_reset:
      name: "Factory Reset"
      id: ${dfrobot_id}_factory_reset

# Select configuration
select:
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    operating_mode:
      name: "OUT Mode"
      id: ${dfrobot_id}_out_mode_select
    motion_sensitivity:
      name: "Motion Sensitivity"
      id: ${dfrobot_id}_motion_sensitivity
    presence_sensitivity:
      name: "Presence Sensitivity"
      id: ${dfrobot_id}_presence_sensitivity
    resolution_mode:
      name: "Resolution Mode"
      id: ${dfrobot_id}_resolution_mode
    gate_selector:
      name: "Selected Distance Gate"
      id: ${dfrobot_id}_gate_selector

# Min and max detection range configuration
number:
  - platform: dfrobot_c4002
    c4002_id: ${dfrobot_id}
    max_range:
      name: "Max Detection Distance"
      id: ${dfrobot_id}_max_range
    min_range:
      name: "Min Detection Distance"
      id: ${dfrobot_id}_min_range
    light_threshold:
      name: "Light Threshold"
      id: ${dfrobot_id}_light_threshold
    lock_time:
      name: "Lock Time"
      id: ${dfrobot_id}_lock_time
    report_period:
      name: "Report Period"
      id: ${dfrobot_id}_report_period
    gate_motion_threshold:
      name: "Selected Gate Motion Threshold"
      id: ${dfrobot_id}_gate_motion_threshold
    gate_presence_threshold:
      name: "Selected Gate Presence Threshold"
      id: ${dfrobot_id}_gate_presence_threshold
    area1_min:
      name: "Area 1 Excluded Range Min"
      id: ${dfrobot_id}_area1_min
    area1_max:
      name: "Area 1 Excluded Range Max"
      id: ${dfrobot_id}_area1_max
    area2_min:
      name: "Area 2 Excluded Range Min"
      id: ${dfrobot_id}_area2_min
    area2_max:
      name: "Area 2 Excluded Range Max"
      id: ${dfrobot_id}_area2_max
    area3_min:
      name: "Area 3 Excluded Range Min"
      id: ${dfrobot_id}_area3_min
    area3_max:
      name: "Area 3 Excluded Range Max"
      id: ${dfrobot_id}_area3_max
    target_disappeard_delay_time:
      name: "Target Disappear Delay Time"
      id: ${dfrobot_id}_target_disappeard_delay_time
